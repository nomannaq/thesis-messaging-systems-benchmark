version: '2'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 22181:2181
  
  kafka:
    image: confluentinc/cp-kafka:5.3.1
    depends_on:
      - zookeeper
    ports:
      - 29092:29092 #Exposed to the host
    expose:
      - '9092'    
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  
  init-kafka:
    image: confluentinc/cp-kafka:5.3.1
    depends_on:
      - kafka
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      # Wait for Kafka to be reachable
      echo 'Waiting for Kafka to be ready...'
      while ! kafka-topics --bootstrap-server kafka:9092 --list; do
        echo 'Kafka not ready yet. Retrying in 5 seconds...'
        sleep 5
      done

      # Create Kafka topics
      echo 'Creating Kafka topics...'
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic test_topic --replication-factor 1 --partitions 2
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic test-topic --replication-factor 1 --partitions 2

      # Create a consumer group
      echo 'Creating a consumer group...'
      kafka-consumer-groups --bootstrap-server kafka:9092 --create --group test-group --topic test_topic --reset-offsets --to-earliest

      # List all topics to confirm creation
      echo 'Successfully created the following topics:'
      kafka-topics --bootstrap-server kafka:9092 --list
      "

  producer:
    build:
      context: ./prod
      dockerfile: Dockerfile
    depends_on:
      - init-kafka
    environment:
      KAFKA_BROKER: "kafka:9092"
      GOTOOLCHAIN: "auto"
    command: ["go", "run", "producer.go", "1024", "10000", "1m"]
  
  consumer:
    build:
      context: ./cons
      dockerfile: Dockerfile
    container_name: kafka_experiment-consumer-1
    depends_on:
      - producer
    environment:
      KAFKA_BROKER: "kafka:9092"
      GOTOOLCHAIN: "auto"
    command: ["go", "run", "consumer.go", "1m"]
  
  export-metrics:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./metrics:/metrics
    depends_on:
      - consumer
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      echo 'Waiting for consumer to complete...'
      while [ \"$(docker inspect -f {{.State.Running}} kafka_experiment-consumer-1 2>/dev/null)\" != \"false\" ]; do
        echo 'Consumer still running, waiting...'
        sleep 5
      done
      
      echo 'Consumer has finished. Copying metrics files...'
      mkdir -p /metrics
      docker cp kafka_experiment-consumer-1:/app/. /metrics/
      echo 'Metrics files copied successfully to host directory'
      echo 'Files available in ./metrics directory:'
      ls -la /metrics/*.csv 2>/dev/null || echo 'No CSV files found'
      "