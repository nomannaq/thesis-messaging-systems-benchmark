version: "3"
services:
  zookeeper:
    image: apachepulsar/pulsar:latest
    container_name: zookeeper
    ports:
      - "2181:2181" # Expose ZooKeeper client port for external access (e.g., ZooKeeper CLI)
    command: ["bash", "-c", "PID_DIR=/pulsar/logs bin/pulsar-daemon start zookeeper && tail -F /pulsar/logs/*.log"]
    # Optional: Add volumes for persistent ZooKeeper data. Uncomment and create these directories on your host.
    # volumes:
    #   - ./data/zookeeper/data:/pulsar/data/zookeeper
    #   - ./data/zookeeper/datalog:/pulsar/data/zookeeper/datalog

  bookie1:
    image: apachepulsar/pulsar:latest
    container_name: bookie1
    ports:
      - "3181:3181" # Expose Bookie 1 port (host:container)
    depends_on:
      - zookeeper # Ensure Zookeeper starts before Bookies
    command: ["bash", "-c", "PID_DIR=/pulsar/logs bin/pulsar-daemon start bookie -conf bookkeeper.conf && tail -F /pulsar/logs/*.log"]
    environment:
      PULSAR_PREFIX_zookeeperServers: zookeeper:2181 # Point to Zookeeper service within Docker network
      PULSAR_PREFIX_bookiePort: 3181 # Internal port for bookie
    # Optional: Add volumes for persistent Bookie data. Uncomment and create these directories on your host.
    # volumes:
    #   - ./data/bookie1/data:/pulsar/data/bookie
    #   - ./data/bookie1/journal:/pulsar/data/journal

  bookie2:
    image: apachepulsar/pulsar:latest
    container_name: bookie2
    ports:
      - "3182:3181" # Expose Bookie 2 port (host:container). Use different host ports.
    depends_on:
      - zookeeper
    command: ["bash", "-c", "PID_DIR=/pulsar/logs bin/pulsar-daemon start bookie -conf bookkeeper.conf && tail -F /pulsar/logs/*.log"]
    environment:
      PULSAR_PREFIX_zookeeperServers: zookeeper:2181
      PULSAR_PREFIX_bookiePort: 3181

  bookie3:
    image: apachepulsar/pulsar:latest
    container_name: bookie3
    ports:
      - "3183:3181" # Expose Bookie 3 port (host:container). Use different host ports.
    depends_on:
      - zookeeper
    command: ["bash", "-c", "PID_DIR=/pulsar/logs bin/pulsar-daemon start bookie -conf bookkeeper.conf && tail -F /pulsar/logs/*.log"]
    environment:
      PULSAR_PREFIX_zookeeperServers: zookeeper:2181
      PULSAR_PREFIX_bookiePort: 3181

  pulsar:
    image: apachepulsar/pulsar:latest
    container_name: pulsar1
    ports:
      - "6650:6650"   # Pulsar broker port for messaging (for your Go producer)
      - "8080:8080"   # Pulsar REST API and web interface (for admin tools/UI)
    depends_on:
      - zookeeper
      - bookie1
      - bookie2
      - bookie3
    command: ["bash", "-c", "PID_DIR=/pulsar/logs bin/pulsar-daemon start broker && tail -F /pulsar/logs/*.log"]
    environment:
      PULSAR_PREFIX_zookeeperServers: zookeeper:2181
      PULSAR_PREFIX_configurationStoreServers: zookeeper:2181
      # *** CRITICAL FOR EXTERNAL CONNECTIONS ***
      # Tells the broker what IP address to advertise to clients.
      # Using 127.0.0.1 explicitly forces IPv4 loopback.
      # If your producer is on a different machine, replace '127.0.0.1' with your Docker host's actual IP address.
      PULSAR_PREFIX_advertisedAddress: 127.0.0.1
      # Tells the broker which network interfaces to listen on inside the container.
      # 0.0.0.0 means listen on all available interfaces (IPv4 and IPv6).
      PULSAR_PREFIX_listeners: "pulsar://0.0.0.0:6650"
      # Ensures the advertised port matches the exposed port
      PULSAR_PREFIX_brokerServicePort: 6650